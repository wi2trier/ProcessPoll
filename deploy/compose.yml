name: processpoll

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}/proxy:${IMAGE_TAG:-stable}
    restart: unless-stopped
    <<: *hardening
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

      - ${CADDY_CONF_DIR:-./caddy.d}:/etc/caddy/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:

      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - internal
    logging: *default-logging

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}/backend:${IMAGE_TAG:-stable}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      PROCESSPOLL_ENV: prod
      PROCESSPOLL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-processpoll}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-processpoll}
      PROCESSPOLL_PUBLIC_URL: ${PROCESSPOLL_PUBLIC_URL:-}
      PROCESSPOLL_ALLOWED_ORIGINS: ${PROCESSPOLL_ALLOWED_ORIGINS:-}
      PROCESSPOLL_TRUSTED_PROXY: "true"
      PROCESSPOLL_SESSION_CREATE_PER_HOUR: ${PROCESSPOLL_SESSION_CREATE_PER_HOUR:-30}

      PROCESSPOLL_COMPUTE_PROCESSES: ${PROCESSPOLL_COMPUTE_PROCESSES:-2}
      PROCESSPOLL_DEMO_MODE: ${PROCESSPOLL_DEMO_MODE:-false}
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *hardening
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-processpoll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-processpoll}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - internal
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *hardening
    init: true

    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-processpoll}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-processpoll}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      PROCESSPOLL_DEMO_MODE: ${PROCESSPOLL_DEMO_MODE:-false}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

networks:
  edge: {}
  internal:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
