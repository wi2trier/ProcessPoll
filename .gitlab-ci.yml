stages:
  - test
  - build
  - e2e
  - licenses
  - images
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

  BUILDX_CACHE: "true"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.python:
  image: python:3.15-slim

.node:
  image: node:26-alpine

.rules-backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

.rules-frontend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

.backend-base:
  extends: [.python, .rules-backend]
  stage: test
  cache:
    key:
      files:
        - backend/pyproject.toml
      prefix: pip
    paths:
      - .cache/pip
  before_script:
    - cd backend

    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -e ".[dev]"

backend:lint:
  extends: .backend-base
  script:
    - ruff check .
    - ruff format --check .
    - pyright

backend:test:sqlite:
  extends: .backend-base
  script:
    - pytest -q --junitxml="$CI_PROJECT_DIR/report-backend-sqlite.xml"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-backend-sqlite.xml

backend:test:postgres:
  extends: .backend-base
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: test
    POSTGRES_HOST_AUTH_METHOD: trust
    PROCESSPOLL_TEST_DATABASE_URL: "postgresql+asyncpg://test:test@postgres:5432/test"
  script:
    - export PROCESSPOLL_DATABASE_URL="$PROCESSPOLL_TEST_DATABASE_URL"
    - alembic upgrade head
    - alembic check
    - alembic downgrade base
    - alembic upgrade head
    - pytest -q --junitxml="$CI_PROJECT_DIR/report-backend-postgres.xml"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-backend-postgres.xml

backend:test:oracle:
  extends: .python
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  allow_failure: true
  cache:
    key:
      files:
        - backend/pyproject.toml
      prefix: pip
    paths:
      - .cache/pip
  script:
    - cd backend
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -e ".[dev,oracle]"
    - pytest -q tests/test_oracle_pm4py.py -rs

.frontend-base:
  extends: [.node, .rules-frontend]
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - .cache/npm
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund

frontend:lint-test:
  extends: .frontend-base
  stage: test
  variables:
    CI: "true"
  script:
    - npm run lint
    - npm run typecheck
    - npm test

frontend:build:
  extends: .frontend-base
  stage: build
  script:
    - npm run build

    - node ../deploy/ci/scan-dist.mjs dist
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/dist

repo:checks:
  extends: .python
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/**/*
        - loadtest/**/*
        - "*.md"
        - renovate.json
        - backend/app/config.py
        - backend/app/routes.py
        - frontend/package.json
        - frontend/package-lock.json
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - pip install pyyaml

    - python deploy/ci/check-yaml.py
    - python -m compileall -q deploy loadtest
    - python deploy/license_check.py --selftest

    - for f in deploy/*.sh deploy/backup/*.sh deploy/tests/*.sh deploy/tests/bin/*; do bash -n "$f"; done
    - sh -n deploy/entrypoint.sh
    - sh -n deploy/backup/backup.sh

repo:script-tests:
  extends: .python
  stage: test
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/*.sh
        - deploy/backup/*
        - deploy/tests/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - bash deploy/tests/run-all.sh

e2e:
  stage: e2e

  image: mcr.microsoft.com/playwright:v1.49.1-noble

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: e2e
    POSTGRES_PASSWORD: e2e
    POSTGRES_DB: e2e
    PROCESSPOLL_ENV: dev
    PROCESSPOLL_DATABASE_URL: "postgresql+asyncpg://e2e:e2e@postgres:5432/e2e"
    PROCESSPOLL_PUBLIC_URL: "http://127.0.0.1:8080"
    PROCESSPOLL_ALLOWED_ORIGINS: "http://127.0.0.1:8080"

    PROCESSPOLL_SESSION_CREATE_PER_HOUR: "1000"
    PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8080"
    PLAYWRIGHT_HTML_OPEN: "never"
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: "test-results/junit.xml"
    CI: "true"
  script:
    - node --version
    - node -e "const [a, b] = process.versions.node.split('.').map(Number); if (a < 22 || (a === 22 && b < 12)) { console.error('Node >= 22.12 is required by vite 8'); process.exit(1); }"
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv python3-pip >/dev/null
    - python3 -m venv /tmp/venv
    - /tmp/venv/bin/pip install -q ./backend
    - cd backend
    - /tmp/venv/bin/alembic upgrade head
    - (/tmp/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$CI_PROJECT_DIR/backend.log" 2>&1 &)
    - cd "$CI_PROJECT_DIR"
    - python3 deploy/ci/wait-for-url.py http://127.0.0.1:8000/healthz --timeout 90
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build
    - node ../deploy/ci/scan-dist.mjs dist

    - (node ../deploy/ci/serve-dist.mjs --dist dist --port 8080 --backend http://127.0.0.1:8000 --headers production --allow-test-eval > "$CI_PROJECT_DIR/serve.log" 2>&1 &)
    - python3 ../deploy/ci/wait-for-url.py http://127.0.0.1:8080/healthz --timeout 30
    - npx playwright install chromium
    - npm run e2e -- --reporter=list,html,junit
  after_script:
    - echo "--- backend.log (tail) ---"; tail -n 50 backend.log || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
      - backend.log
      - serve.log
    reports:
      junit: frontend/test-results/junit.xml
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - .cache/npm

.licenses-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/pyproject.toml
        - frontend/package.json
        - frontend/package-lock.json
        - deploy/license-allowlist.json
        - deploy/license_check.py
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

licenses:python:
  extends: [.python, .licenses-rules]
  stage: licenses
  needs: []
  script:
    - python -m venv /tmp/venv
    - /tmp/venv/bin/pip install -q ./backend pip-licenses
    - /tmp/venv/bin/pip-licenses --format=json --from=mixed > py-licenses.json
    - python deploy/license_check.py --kind python --input py-licenses.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - py-licenses.json

licenses:python-dev:
  extends: [.python, .licenses-rules]
  stage: licenses
  needs: []
  allow_failure: true
  script:
    - python -m venv /tmp/venv
    - /tmp/venv/bin/pip install -q "./backend[dev]" pip-licenses
    - /tmp/venv/bin/pip-licenses --format=json --from=mixed > py-licenses-dev.json
    - python deploy/license_check.py --kind python --input py-licenses-dev.json

licenses:node:
  extends: [.node, .licenses-rules]
  stage: licenses
  needs: []
  script:
    - apk add --no-cache python3 >/dev/null
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx --yes license-checker-rseidelsohn@4 --json --production > ../node-licenses.json
    - cd ..
    - python3 deploy/license_check.py --kind node --input node-licenses.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - node-licenses.json
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - .cache/npm

licenses:node-dev:
  extends: [.node, .licenses-rules]
  stage: licenses
  needs: []
  allow_failure: true
  script:
    - apk add --no-cache python3 >/dev/null
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx --yes license-checker-rseidelsohn@4 --json --development > ../node-licenses-dev.json
    - cd ..
    - python3 deploy/license_check.py --kind node --input node-licenses-dev.json --allow-empty

.docker-build:
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
    - docker info >/dev/null
    - docker buildx create --name ci --driver docker-container --use

images:verify:
  extends: .docker-build
  stage: images
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/Dockerfile.*
        - deploy/*.dockerignore
        - deploy/Caddyfile
        - deploy/entrypoint.sh
        - backend/pyproject.toml
        - backend/alembic.ini
        - frontend/package.json
        - frontend/package-lock.json
  parallel:
    matrix:
      - COMPONENT: [backend, proxy]
  script:

    - docker buildx build --file "deploy/Dockerfile.$COMPONENT" --output type=cacheonly .

images:
  extends: .docker-build
  stage: images
  needs:
    - job: "backend:lint"
      optional: true
    - job: "backend:test:sqlite"
      optional: true
    - job: "backend:test:postgres"
      optional: true
    - job: "frontend:lint-test"
      optional: true
    - job: "licenses:python"
      optional: true
    - job: "licenses:node"
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  parallel:
    matrix:
      - COMPONENT: [backend, proxy]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$COMPONENT"
      TAGS="--tag $IMAGE:$CI_COMMIT_SHORT_SHA"
      VERSION="$CI_COMMIT_SHORT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="$CI_COMMIT_TAG"
        TAGS="$TAGS --tag $IMAGE:$CI_COMMIT_TAG"
        BARE="${CI_COMMIT_TAG#v}"
        if [ "$BARE" != "$CI_COMMIT_TAG" ]; then TAGS="$TAGS --tag $IMAGE:$BARE"; fi

        if echo "$CI_COMMIT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="$TAGS --tag $IMAGE:stable --tag $IMAGE:latest"
        fi
      else
        TAGS="$TAGS --tag $IMAGE:edge"
      fi
      CACHE=""
      if [ "$BUILDX_CACHE" = "true" ]; then
        CACHE="--cache-from type=registry,ref=$IMAGE:buildcache --cache-to type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
      fi
      echo "building $IMAGE with: $TAGS"

      docker buildx build \
        --file "deploy/Dockerfile.$COMPONENT" \
        --build-arg "VERSION=$VERSION" \
        --build-arg "REVISION=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --provenance=false \
        $TAGS $CACHE \
        --push .

.deploy-base:
  stage: deploy
  interruptible: false
  resource_group: production
  needs: []
  dependencies: []

deploy:ssh:
  extends: .deploy-base
  image: alpine:3.24
  rules:
    - if: $DEPLOY_VIA_SSH == "true" && $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $DEPLOY_VIA_SSH == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $DEPLOY_VIA_SSH == "true" && $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client >/dev/null
  script:

    - |
      TAG="${DEPLOY_TAG:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}}"
      echo "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "invalid tag '$TAG'"; exit 1; }
      : "${DEPLOY_HOST:?DEPLOY_HOST is not set}" "${DEPLOY_USER:?DEPLOY_USER is not set}"
      : "${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY is not set}" "${DEPLOY_SSH_KNOWN_HOSTS:?DEPLOY_SSH_KNOWN_HOSTS is not set}"
      chmod 600 "$DEPLOY_SSH_PRIVATE_KEY"
      echo "deploying $TAG to $DEPLOY_USER@$DEPLOY_HOST"
      ssh -i "$DEPLOY_SSH_PRIVATE_KEY" -o IdentitiesOnly=yes \
          -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS" -o StrictHostKeyChecking=yes \
          -o BatchMode=yes -o ServerAliveInterval=30 -p "${DEPLOY_SSH_PORT:-22}" \
          "$DEPLOY_USER@$DEPLOY_HOST" \
          "cd '${DEPLOY_PATH:-/opt/processpoll/deploy}' && ./deploy.sh '$TAG'"

deploy:runner:
  extends: .deploy-base

  tags:
    - processpoll-host
  rules:
    - if: $DEPLOY_VIA_RUNNER == "true" && $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $DEPLOY_VIA_RUNNER == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $DEPLOY_VIA_RUNNER == "true" && $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  environment:
    name: production
  script:
    - |
      TAG="${DEPLOY_TAG:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}}"
      echo "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "invalid tag '$TAG'"; exit 1; }
      cd "${DEPLOY_PATH:-/opt/processpoll/deploy}"
      ./deploy.sh "$TAG"

deploy:pin-stable:
  extends: [.deploy-base, .docker-build]
  needs: []
  rules:
    - if: $DEPLOY_VIA_SSH != "true" && $DEPLOY_VIA_RUNNER != "true" && $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $DEPLOY_VIA_SSH != "true" && $DEPLOY_VIA_RUNNER != "true" && $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:

    - |
      TAG="${DEPLOY_TAG:-${CI_COMMIT_TAG:-}}"
      [ -n "$TAG" ] || { echo "set DEPLOY_TAG (e.g. 1.2.0) when starting this job"; exit 1; }
      echo "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "invalid tag '$TAG'"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      TAG="${DEPLOY_TAG:-${CI_COMMIT_TAG:-}}"
      for component in backend proxy; do
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/$component:stable" \
          "$CI_REGISTRY_IMAGE/$component:$TAG"
      done
      echo "stable -> $TAG. Pull-based hosts pick it up on their next run of pull-and-restart.sh"
      echo "(systemd timer), or run it on the host now: ./pull-and-restart.sh"
